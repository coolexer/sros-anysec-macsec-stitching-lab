configure {
    system {
        name "pe3"
    }
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type m5e10-100g-qsfp28
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    macsec {
        connectivity-association "CA-MACSEC" {
            admin-state enable
            cipher-suite gcm-aes-128
            mka-hello-interval 2
            static-cak {
                active-psk 1
                pre-shared-key 1 {
                    encryption-type aes-128-cmac
                    cak "fedcba9876543210fedcba9876543210"
                    cak-name "2233"
                }
            }
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
            mtu 9212
            dot1x {
                macsec {
                    rx-must-be-encrypted true
                    sub-port 1 {
                        admin-state enable
                        ca-name "CA-MACSEC"
                        max-peers 1
                        encap-match {
                            all-match true
                        }
                    }
                }
            }
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    policy-options {
        policy-statement "EXPORT-VPRN" {
            entry 10 {
                from {
                    protocol {
                        name [direct bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type accept
            }
        }
    }
    router "Base" {
        autonomous-system 65200
        router-id 10.20.1.3
        interface "system" {
            admin-state enable
            ipv4 {
                primary {
                    address 10.20.1.3
                    prefix-length 32
                }
            }
        }
    }
    service {
        epipe "EPIPE-100" {
            admin-state enable
            service-id 100
            customer "1"
            sap 1/1/c1/1:100 {
                admin-state enable
            }
            sap 1/1/c3/1:100 {
                admin-state enable
            }
        }
        vprn "VPRN-200" {
            admin-state enable
            service-id 200
            customer "1"
            autonomous-system 65200
            interface "to-pe2-macsec" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.16.200.2
                        prefix-length 30
                    }
                }
                sap 1/1/c1/1:200 {
                    admin-state enable
                }
            }
            interface "acc-ce2" {
                admin-state enable
                ipv4 {
                    primary {
                        address 192.168.20.1
                        prefix-length 24
                    }
                }
                sap 1/1/c3/1:200 {
                    admin-state enable
                }
            }
            bgp {
                admin-state enable
                group "EBGP-PE2" {
                    peer-as 65000
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["EXPORT-VPRN"]
                    }
                    export {
                        policy ["EXPORT-VPRN"]
                    }
                }
                neighbor "172.16.200.1" {
                    group "EBGP-PE2"
                }
            }
        }
    }
}
