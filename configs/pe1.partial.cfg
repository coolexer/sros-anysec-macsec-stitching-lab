configure {
    system {
        name "pe1"
    }
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type m5e10-100g-qsfp28
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9212
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    macsec {
        connectivity-association "CA-ANYSEC" {
            admin-state enable
            anysec true
            cipher-suite gcm-aes-xpn-256
            mka-hello-interval 2
            static-cak {
                active-psk 1
                pre-shared-key 1 {
                    encryption-type aes-256-cmac
                    cak "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
                    cak-name "1122"
                }
            }
        }
    }
    router "Base" {
        autonomous-system 65000
        router-id 10.20.1.1
        mpls-labels {
            sr-labels {
                start 60000
                end 120000
            }
            reserved-label-block "Anysec" {
                start-label 50000
                end-label 59999
            }
        }
        interface "system" {
            admin-state enable
            ipv4 {
                primary {
                    address 10.20.1.1
                    prefix-length 32
                }
            }
        }
        interface "to-pe2" {
            admin-state enable
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.10.12.1
                    prefix-length 30
                }
            }
        }
        isis 0 {
            admin-state enable
            area-address [49.0001]
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                admin-state enable
                passive true
                ipv4-node-sid {
                    index 1
                }
            }
            interface "to-pe2" {
                admin-state enable
                interface-type point-to-point
            }
        }
        ldp {
            admin-state enable
            targeted-session {
                peer 10.20.1.2 {
                    admin-state enable
                }
            }
        }
        bgp {
            admin-state enable
            rapid-withdrawal true
            rapid-update {
                vpn-ipv4 true
            }
            group "IBGP-VPN" {
                peer-as 65000
                local-address 10.20.1.1
                family {
                    vpn-ipv4 true
                }
            }
            neighbor "10.20.1.2" {
                group "IBGP-VPN"
            }
        }
    }
    anysec {
        reserved-label-block "Anysec"
        mka-over-ip {
            mka-udp-port 10000
        }
        mpls {
            security-termination-policies {
                policy "STP-PE1" {
                    admin-state enable
                    local-address 10.20.1.1
                    protocol sr-isis
                    rx-must-be-encrypted true
                }
            }
            tunnel-encryption {
                encryption-group "EG-TUNNEL" {
                    admin-state enable
                    ca-name "CA-ANYSEC"
                    encryption-label 50001
                    security-termination-policy "STP-PE1"
                    peer-tunnel-attributes {
                        protocol sr-isis
                    }
                    peer 10.20.1.2 {
                        admin-state enable
                    }
                }
            }
        }
    }
    service {
        sdp 12 {
            admin-state enable
            delivery-type mpls
            sr-isis true
            far-end {
                ip-address 10.20.1.2
            }
        }
        epipe "EPIPE-100" {
            admin-state enable
            service-id 100
            customer "1"
            sap 1/1/c2/1:100 {
                admin-state enable
            }
            spoke-sdp 12:100 {
                admin-state enable
            }
        }
        vprn "VPRN-200" {
            admin-state enable
            service-id 200
            customer "1"
            autonomous-system 65000
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "65000:200"
                    vrf-target {
                        community "target:65000:200"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-isis true
                        }
                    }
                }
            }
            interface "acc-ce1" {
                admin-state enable
                ipv4 {
                    primary {
                        address 192.168.10.1
                        prefix-length 24
                    }
                }
                sap 1/1/c2/1:200 {
                    admin-state enable
                }
            }
        }
    }
}
